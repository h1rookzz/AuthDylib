name: Build KernelAuth dylib

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          brew install ldid xz
          git clone --recursive https://github.com/theos/theos.git $THEOS
          git clone https://github.com/theos/sdks.git /tmp/sdks
          ls /tmp/sdks/
          SDK=$(ls /tmp/sdks/ | grep iPhoneOS | head -1)
          cp -r /tmp/sdks/$SDK $THEOS/sdks/
          echo "Using SDK: $SDK"
        env:
          THEOS: /Users/runner/theos

      - name: Create Makefile
        run: |
          SDK=$(ls /Users/runner/theos/sdks/ | grep iPhoneOS | head -1 | sed 's/iPhoneOS//' | sed 's/.sdk//')
          cat > Makefile << EOF
          THEOS_DEVICE_IP =
          TARGET = iphone:clang:$SDK:14.0
          ARCHS = arm64

          include \$(THEOS)/makefiles/common.mk

          TWEAK_NAME = KernelAuth
          KernelAuth_FILES = KernelAuth.mm
          KernelAuth_FRAMEWORKS = UIKit Foundation

          include \$(THEOS)/makefiles/tweak.mk
          EOF
        env:
          THEOS: /Users/runner/theos

      - name: Build
        run: make -j$(sysctl -n hw.ncpu)
        env:
          THEOS: /Users/runner/theos

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: KernelAuth-dylib
          path: .theos/obj/debug/KernelAuth.dylib
