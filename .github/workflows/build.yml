name: Build KernelAuth dylib

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install ldid

      - name: Build dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang++ \
            -arch arm64 \
            -isysroot $SDK \
            -miphoneos-version-min=14.0 \
            -dynamiclib \
            -framework UIKit \
            -framework Foundation \
            -fobjc-arc \
            -o KernelAuth.dylib \
            KernelAuth.mm
          ldid -S KernelAuth.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: KernelAuth-dylib
          path: KernelAuth.dylib
