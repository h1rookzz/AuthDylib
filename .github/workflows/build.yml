name: Build KernelAuth dylib

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-13

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: Build dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -dynamiclib \
            -framework UIKit \
            -framework Foundation \
            -fobjc-arc \
            -o KernelAuth.dylib \
            KernelAuth.mm

      - name: Sign dylib
        run: |
          brew install ldid
          ldid -S KernelAuth.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: KernelAuth-dylib
          path: KernelAuth.dylib

